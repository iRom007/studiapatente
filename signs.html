<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segnaletica Stradale — Справочник знаков | StudiaPatente</title>
<meta name="description" content="Справочник итальянских дорожных знаков. 400 знаков с изображениями, описанием и переводом на русский язык.">
<style>
:root {
  --bg: #f8f9fa;
  --card: #ffffff;
  --border: #e9ecef;
  --text: #212529;
  --muted: #6c757d;
  --primary: #2563eb;
  --primary-light: #eff6ff;
  --accent: #dc2626;
  --success: #16a34a;
  --warning: #d97706;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --primary: #3b82f6;
  --primary-light: #1e3a5f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
.nav {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-logo { font-weight: 800; font-size: 1.1rem; color: var(--primary); text-decoration: none; }
.nav-logo span { color: var(--accent); }
.nav-sep { color: var(--border); }
.nav-title { font-size: .95rem; color: var(--muted); flex: 1; }
.nav-back { text-decoration: none; color: var(--primary); font-size: .9rem; font-weight: 600; padding: 6px 14px; border: 1.5px solid var(--primary); border-radius: 8px; white-space: nowrap; }
.nav-back:hover { background: var(--primary-light); }
.nav-theme { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 4px 8px; border-radius: 8px; color: var(--text); }
.nav-lang { display: flex; gap: 4px; }
.nav-lang button { background: none; border: 1.5px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: .78rem; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav-lang button.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

/* HERO */
.hero {
  background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #0ea5e9 100%);
  color: white;
  padding: 32px 20px 24px;
  text-align: center;
}
.hero h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
.hero p { opacity: .85; font-size: 1rem; }
.hero-stats { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
.hero-stat { text-align: center; }
.hero-stat strong { display: block; font-size: 1.5rem; font-weight: 800; }
.hero-stat span { font-size: .8rem; opacity: .8; }

/* CONTROLS */
.controls {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: .95rem;
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.search-wrap input:focus { border-color: var(--primary); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1rem; pointer-events: none; }
.filter-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn {
  padding: 7px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--bg);
  color: var(--muted);
  white-space: nowrap;
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--primary); color: var(--primary); }
.filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
.results-count { font-size: .85rem; color: var(--muted); white-space: nowrap; margin-left: auto; }

/* GRID */
.main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }
.signs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}
.sign-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  position: relative;
}
.sign-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); border-color: var(--primary); }
.sign-card.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
.sign-img-wrap {
  background: #f8f9fa;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 130px;
  padding: 16px;
}
[data-theme="dark"] .sign-img-wrap { background: #1a2332; }
.sign-img-wrap img { max-height: 90px; max-width: 100%; object-fit: contain; }
.sign-img-wrap .no-img { font-size: 2.5rem; opacity: .3; }
.sign-info { padding: 10px 12px; }
.sign-tid-badge {
  display: inline-block;
  font-size: .68rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.sign-label { font-size: .82rem; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sign-label-ru { font-size: .78rem; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card);
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  transform: scale(.95);
  transition: transform .2s;
}
.modal-overlay.open .modal { transform: scale(1); }
.modal-img-wrap {
  background: #f0f4f8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  min-height: 200px;
}
[data-theme="dark"] .modal-img-wrap { background: #1a2332; }
.modal-img-wrap img { max-height: 160px; max-width: 100%; object-fit: contain; }
.modal-body { padding: 24px; }
.modal-tid { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .05em; }
.modal-title-it { font-size: 1.05rem; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
.modal-title-ru { font-size: .95rem; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: .9rem; font-weight: 600; }
.modal-btn-primary { background: var(--primary); color: white; }
.modal-btn-primary:hover { opacity: .9; }
.modal-btn-close { background: var(--border); color: var(--text); }
.modal-btn-close:hover { background: var(--muted); color: white; }
.modal-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-top: 1px solid var(--border); }
.modal-nav-btn { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer; color: var(--text); font-size: .9rem; }
.modal-nav-btn:hover { border-color: var(--primary); color: var(--primary); }
.modal-nav-btn:disabled { opacity: .3; cursor: default; }
.modal-counter { font-size: .85rem; color: var(--muted); }

/* EMPTY */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state span { font-size: 3rem; display: block; margin-bottom: 12px; }

/* CAT COLORS */
.tid-segnali-pericolo       { background: #fef3c7; color: #92400e; }
.tid-segnali-divieto        { background: #fee2e2; color: #991b1b; }
.tid-segnali-obbligo        { background: #dbeafe; color: #1e40af; }
.tid-segnali-indicazione    { background: #d1fae5; color: #065f46; }
.tid-precedenza-incroci     { background: #f3f4f6; color: #374151; }
.tid-pannelli-integrativi   { background: #ede9fe; color: #5b21b6; }
.tid-segnaletica-orizzontale{ background: #fce7f3; color: #9d174d; }
.tid-segnalazioni-semaforiche{background: #ecfdf5; color: #064e3b; }
.tid-segnali-complementari  { background: #fff7ed; color: #9a3412; }
.tid-norme-circolazione     { background: #f0fdf4; color: #14532d; }
.tid-luci-dispositivi       { background: #fdf4ff; color: #6b21a8; }
.tid-definizioni-doveri     { background: #f8fafc; color: #334155; }
[data-theme="dark"] .tid-segnali-pericolo       { background: #451a03; color: #fcd34d; }
[data-theme="dark"] .tid-segnali-divieto        { background: #450a0a; color: #fca5a5; }
[data-theme="dark"] .tid-segnali-obbligo        { background: #1e3a5f; color: #93c5fd; }
[data-theme="dark"] .tid-segnali-indicazione    { background: #052e16; color: #6ee7b7; }
[data-theme="dark"] .tid-precedenza-incroci     { background: #1e293b; color: #cbd5e1; }
[data-theme="dark"] .tid-pannelli-integrativi   { background: #2e1065; color: #c4b5fd; }
[data-theme="dark"] .tid-segnaletica-orizzontale{ background: #500724; color: #fbcfe8; }
[data-theme="dark"] .tid-segnalazioni-semaforiche{background: #022c22; color: #6ee7b7; }
[data-theme="dark"] .tid-segnali-complementari  { background: #431407; color: #fdba74; }
[data-theme="dark"] .tid-norme-circolazione     { background: #052e16; color: #86efac; }
[data-theme="dark"] .tid-luci-dispositivi       { background: #2e1065; color: #d8b4fe; }
[data-theme="dark"] .tid-definizioni-doveri     { background: #0f172a; color: #94a3b8; }

@media (max-width: 600px) {
  .signs-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .sign-img-wrap { height: 110px; }
  .hero h1 { font-size: 1.4rem; }
  .hero-stats { gap: 16px; }
  .controls { padding: 12px 16px; }
  .main { padding: 16px; }
}
</style>
</head>

// ── Init ──────────────────────────────────────────────────────────────────────
applyTheme();
applyLang();
filterSigns();

// ── Theme ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('sp_theme', theme);
  applyTheme();
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
}

// ── Lang ──────────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  localStorage.setItem('sp_lang', l);
  applyLang();
  filterSigns();
}
function applyLang() {
  const t = T[lang];
  document.getElementById('nav-title').textContent = t.navTitle;
  document.getElementById('hero-title').textContent = t.heroTitle;
  document.getElementById('hero-sub').textContent = t.heroSub;
  document.getElementById('stat-signs').textContent = t.statSigns;
  document.getElementById('stat-cats').textContent = t.statCats;
  document.getElementById('stat-langs').textContent = t.statLangs;
  document.getElementById('search-input').placeholder = t.searchPlaceholder;
  document.getElementById('modal-practice-btn').textContent = t.practiceBtn;
  document.getElementById('modal-prev').textContent = t.prevBtn;
  document.getElementById('modal-next').textContent = t.nextBtn;
  document.getElementById('nav-back-btn').textContent = t.backBtn;
  // Update filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const tid = btn.dataset.tid;
    if (t.catNames[tid]) btn.textContent = t.catNames[tid];
  });
  // Update active lang buttons
  ['it','ru','en'].forEach(l => {
    document.getElementById('btn-'+l).classList.toggle('active', l === lang);
  });
  updateResultsCount();
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(tid) {
  activeFilter = tid;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tid === tid);
  });
  filterSigns();
}

function filterSigns() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  filteredSigns = SIGNS.filter(s => {
    const matchCat = activeFilter === 'all' || s.tid === activeFilter;
    if (!matchCat) return false;
    if (!q) return true;
    return s.it.toLowerCase().includes(q) || s.ru.toLowerCase().includes(q) || s.tid.includes(q);
  });
  renderGrid();
  updateResultsCount();
}

function updateResultsCount() {
  const t = T[lang];
  document.getElementById('results-count').textContent = t.resultsCount(filteredSigns.length);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('signs-grid');
  const empty = document.getElementById('empty-state');
  if (filteredSigns.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    document.getElementById('empty-text').textContent = T[lang].emptyText;
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = filteredSigns.map((s, i) => {
    const label = lang === 'ru' ? s.ru : s.it;
    const sub   = lang !== 'ru' ? s.ru : '';
    return `<div class="sign-card" onclick="openModal(${i})">
      <div class="sign-img-wrap">
        <img src="${IMGBASE}${s.img}" alt="" loading="lazy" onerror="this.outerHTML='<span class=no-img>🚦</span>'">
      </div>
      <div class="sign-info">
        <span class="sign-tid-badge tid-${s.tid}">${tidShort(s.tid)}</span>
        <div class="sign-label">${escHtml(label)}</div>
        ${sub ? `<div class="sign-label-ru">${escHtml(sub.substring(0,80))}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function tidShort(tid) {
  const map = {
    'segnali-pericolo':'⚠️','segnali-divieto':'🚫','segnali-obbligo':'🔵',
    'segnali-indicazione':'🟦','precedenza-incroci':'✋','pannelli-integrativi':'📋',
    'segnaletica-orizzontale':'🛣️','segnalazioni-semaforiche':'🚦',
    'segnali-complementari':'ℹ️','norme-circolazione':'📖',
    'luci-dispositivi':'💡','definizioni-doveri':'📝'
  };
  return map[tid] || tid;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(idx) {
  activeIndex = idx;
  renderModal();
  document.getElementById('modal-overlay').classList.add('open');
  document.addEventListener('keydown', handleKey);
}

function renderModal() {
  const s = filteredSigns[activeIndex];
  if (!s) return;
  const t = T[lang];
  document.getElementById('modal-img').src = IMGBASE + s.img;
  document.getElementById('modal-tid').textContent = t.catNames[s.tid] || s.tid;
  document.getElementById('modal-tid').className = `modal-tid tid-${s.tid}`;
  document.getElementById('modal-title-it').textContent = s.it;
  document.getElementById('modal-title-ru').textContent = s.ru;
  document.getElementById('modal-counter').textContent = `${activeIndex + 1} / ${filteredSigns.length}`;
  document.getElementById('modal-prev').disabled = activeIndex === 0;
  document.getElementById('modal-next').disabled = activeIndex === filteredSigns.length - 1;
}

function navModal(dir) {
  const newIdx = activeIndex + dir;
  if (newIdx < 0 || newIdx >= filteredSigns.length) return;
  activeIndex = newIdx;
  renderModal();
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.removeEventListener('keydown', handleKey);
}

function handleKey(e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight') navModal(1);
  if (e.key === 'ArrowLeft') navModal(-1);
}

function practiceSign() {
  const s = filteredSigns[activeIndex];
  if (s) window.location.href = `app.html?topic=${s.tid}`;
}
</script>
